<title>CVFD Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like the Pocket Pump Chart it sits beside; placard-style tiles, tab bar pinned to the bottom for thumb reach. */
:root{
  --bg:#eef0f1; --panel:#ffffff; --ink:#15191c; --muted:#5c656c; --line:#d3d8dc; --plate:#1d2328; --plate-ink:#f4f6f7;
  --hi:#fff3a6; --hi-ink:#3a3200; --field:#f4f5f6; --ok-bg:#e3f3ea; --info:#2459a8; --info-bg:#e4edfa; --bad-bg:#fbe5e3; --warn2:#9a6200; --warn2-bg:#fbf0d9; --none-bg:#eceeef; --red:#c8102e; --red-ink:#ffffff; --warn:#9a3412; --warn-bg:#ffedd5; --ok:#0b7a3b;
  --s1:#6b7280; --s2:#0070c0; --s3:#c8102e; --s4:#0b7a3b; --s5:#d9480f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --panel:#1a1f23; --ink:#eef1f3; --muted:#9aa4ab; --line:#2c3439; --plate:#262d33; --plate-ink:#f4f6f7;
  --hi:#4a4210; --hi-ink:#fff3a6; --field:#13171a; --ok-bg:#0f2e1d; --info:#8ab4ff; --info-bg:#132544; --bad-bg:#3a1214; --warn2:#f5c46b; --warn2-bg:#3a2a08; --none-bg:#262d33; --red:#ef4458; --red-ink:#1a0005; --warn:#fdba74; --warn-bg:#431407; --ok:#4ade80;
  --s1:#9ca3af; --s2:#4aa8ff; --s3:#ef4458; --s4:#34c27a; --s5:#ff8a4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --panel:#1a1f23; --ink:#eef1f3; --muted:#9aa4ab; --line:#2c3439; --plate:#262d33; --plate-ink:#f4f6f7;
  --hi:#4a4210; --hi-ink:#fff3a6; --field:#13171a; --ok-bg:#0f2e1d; --info:#8ab4ff; --info-bg:#132544; --bad-bg:#3a1214; --warn2:#f5c46b; --warn2-bg:#3a2a08; --none-bg:#262d33; --red:#ef4458; --red-ink:#1a0005; --warn:#fdba74; --warn-bg:#431407; --ok:#4ade80;
  --s1:#9ca3af; --s2:#4aa8ff; --s3:#ef4458; --s4:#34c27a; --s5:#ff8a4c; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
header.top{display:flex;align-items:center;gap:12px}
header.top img{width:52px;height:52px;border-radius:50%;flex:none}
header.top .t{min-width:0;flex:1}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0;line-height:1.05;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.07em;text-transform:uppercase;margin:0;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin:0}
section.view{display:flex;flex-direction:column;gap:16px}
.group{display:flex;flex-direction:column;gap:10px}
.gh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px;min-height:96px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c,var(--ink));border-radius:10px;text-decoration:none;color:var(--ink);cursor:pointer;font:inherit;text-align:left}
.tile b{font-family:var(--display);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.tile span{font-size:13px;color:var(--muted)}
.tile .ext{margin-left:auto}
.tile:focus-visible,.row-btn:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* search */
.search{display:flex;gap:8px}
input[type=search],input[type=text],input[type=url],textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
textarea{min-height:200px;font-size:15px;line-height:1.5;resize:vertical}
input:focus-visible,textarea:focus-visible{outline:3px solid var(--ink);outline-offset:1px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row-btn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid var(--line);cursor:pointer;width:100%}
.row-btn:last-child{border-bottom:0}
.row-btn .n{font-family:var(--display);font-weight:700;font-size:22px;color:var(--c,var(--muted));min-width:40px;font-variant-numeric:tabular-nums}
.row-btn .m{min-width:0}
.row-btn .m b{display:block;font-weight:600;font-size:16px;line-height:1.25}
.row-btn .m small{display:block;color:var(--muted);font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.row-btn .chev{font-family:var(--display);font-size:22px;color:var(--muted)}
mark{background:var(--hi);color:var(--hi-ink);border-radius:2px;padding:0 1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{all:unset;box-sizing:border-box;flex:none;cursor:pointer;padding:6px 12px;min-height:38px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}

/* SOG reader */
.doc-h{background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:16px;border-top:8px solid var(--c);display:flex;flex-direction:column;gap:6px}
.doc-h .num{font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.doc-h h1{font-size:32px}
.doc-h .meta{font-size:13px;opacity:.8}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc .chip{font-size:14px;min-height:34px;padding:4px 10px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.doc p{margin:0;max-width:68ch}
.doc .lab{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.doc h3{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:14px 0 0;padding-top:12px;border-top:2px solid var(--line);line-height:1.15;scroll-margin-top:16px}
.doc h3 .k{color:var(--c);margin-right:8px;font-variant-numeric:tabular-nums}
.li{display:grid;grid-template-columns:28px 1fr;gap:4px;max-width:68ch}
.li .mk{font-family:var(--display);font-weight:600;color:var(--muted);text-align:right;padding-right:6px}
.li.l1{margin-left:24px}.li.l2{margin-left:48px}.li.l3{margin-left:64px}
.tbl{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.tbl span{min-width:0;overflow-wrap:anywhere}
.tbl span:first-child{font-weight:600}
.note{font-size:14px;background:var(--hi);color:var(--hi-ink);border-radius:8px;padding:10px 12px;margin:0}
.empty{background:var(--panel);border:2px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* size-up / item bodies */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h .step{flex:none;width:34px;height:34px;border-radius:8px;background:var(--plate);color:var(--plate-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.card-h h3{margin:0;font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;flex:1;min-width:0}
.card-b{padding:8px 14px 14px;display:flex;flex-direction:column;gap:6px}
.body h4{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.body p{margin:0}
.chk{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:24px;height:24px;margin:0;accent-color:var(--ok)}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.say{border-left:4px solid var(--c,var(--red));background:var(--bg);padding:10px 12px;border-radius:0 8px 8px 0;font-style:italic}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--ink);font-weight:600}

/* buttons + edit */
.btn{all:unset;box-sizing:border-box;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:2px solid var(--line);background:var(--panel);font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);padding:0 14px}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.sm{min-height:36px;font-size:15px;padding:0 10px}
.btn.danger{color:var(--red)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.edit-bar{display:flex;gap:6px;flex-wrap:wrap}
.editing-flag{font-size:13px;background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.sheet .in{background:var(--bg);width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field small{color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--plate);color:var(--plate-ink);padding:10px 16px;border-radius:8px;z-index:30;font-size:14px;max-width:90%}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs a{display:flex;align-items:center;justify-content:center;min-height:60px;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.03em;text-transform:uppercase;border-top:3px solid transparent;text-align:center;line-height:1.05}
nav.tabs a[aria-current="page"]{color:var(--ink);border-top-color:var(--red)}
nav.tabs a:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
footer{font-size:12px;color:var(--muted)}

/* cadre check-in (Training Division staff) */
.ck-h{background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:14px 16px;border-top:8px solid var(--red);display:flex;flex-direction:column;gap:6px}
.ck-h .brand{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:14px;opacity:.75}
.ck-nav{display:flex;align-items:center;gap:8px}
.ck-nav h1{flex:1;font-size:26px}
.ck-nav button{all:unset;cursor:pointer;width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:22px}
.ck-nav button:focus-visible{outline:3px solid var(--plate-ink)}
.ck-sub{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;opacity:.9;align-items:center}
.ck-sub .pill{background:var(--red);color:var(--red-ink);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.ck-sub .live{display:inline-flex;align-items:center;gap:6px}
.ck-sub .dot{width:8px;height:8px;border-radius:50%;background:#7a8288}
.ck-sub .dot.on{background:#3ecf7a}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;color:var(--plate-ink)}
#ck-jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#ck-jump a{flex:none;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:4px 12px;text-decoration:none}
#ck-main{display:flex;flex-direction:column}
#ck-main section{margin-top:18px;scroll-margin-top:12px}
#ck-main .sh{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
#ck-main .sh h2{color:var(--ink);font-size:20px}
#ck-main .sh .count{color:var(--muted);font-size:13px}
#ck-main .sh .hint{margin-left:auto;color:var(--muted);font-size:12px}
#ck-main .card{padding:10px 12px;margin-bottom:8px;overflow:visible}
#ck-main .card.flash{box-shadow:0 0 0 3px var(--info)}
#ck-main .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 10px}
#ck-main .f{display:flex;flex-direction:column;min-width:0}
#ck-main .f.wide{grid-column:1/-1}
#ck-main .f label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
#ck-main input,#ck-main select,#ck-main textarea{font:inherit;font-size:15px;color:var(--ink);border:2px solid transparent;background:var(--field);border-radius:8px;padding:7px 8px;width:100%;min-height:38px;min-width:0}
#ck-main textarea{resize:vertical;min-height:64px}
#ck-main input:focus,#ck-main select:focus,#ck-main textarea:focus{outline:none;border-color:var(--info);background:var(--panel)}
#ck-main input:disabled,#ck-main select:disabled,#ck-main textarea:disabled{background:transparent;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
#ck-main .title-in{font-weight:600;font-size:16px}
#ck-main select.stchip{font-weight:600;font-size:13px;border-radius:99px;padding:5px 10px;min-height:32px;width:auto}
.s-none{background:var(--none-bg)!important;color:var(--muted)!important}
.s-ok{background:var(--ok-bg)!important;color:var(--ok)!important}
.s-warn{background:var(--warn2-bg)!important;color:var(--warn2)!important}
.s-bad{background:var(--bad-bg)!important;color:var(--red)!important}
.s-info{background:var(--info-bg)!important;color:var(--info)!important}
#ck-main .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
#ck-main .meta .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ck-main .del{all:unset;cursor:pointer;color:var(--muted);font-size:12px;padding:4px 6px;border-radius:6px}
#ck-main .del.arm{background:var(--bad-bg);color:var(--red);font-weight:600}
#ck-main .add{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;border:2px dashed var(--line);color:var(--muted);border-radius:10px;padding:10px;font-weight:600;cursor:pointer}
#ck-main .empty{all:unset;display:block;color:var(--muted);font-size:13px;padding:4px 4px 10px}
#ck-main .prio{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#ck-main .prio .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:var(--red-ink);font-family:var(--display);font-weight:700;display:grid;place-items:center;font-size:16px}
#ck-main .daylabel{font-size:12px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em}
#ck-main .openlink{font-size:13px;color:var(--info);word-break:break-all}
#ck-main .banner{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:10px;padding:14px;margin-top:16px}
#ck-main .banner h3{margin:0 0 4px;font-family:var(--display);font-size:22px;text-transform:uppercase}
#ck-main .banner p{margin:0 0 10px;color:var(--muted);font-size:14px}
#ck-main .checks{display:grid;gap:6px;margin:8px 0 12px}
#ck-main .checks label{display:flex;gap:8px;align-items:center;font-size:15px}
#ck-main .checks input{width:20px;height:20px;min-height:0}
#ck-main .startbtn:not(.ghost){background:var(--red);border-color:var(--red);color:var(--red-ink)}
#ck-main .note{all:unset;display:block;font-size:13px;color:var(--muted);margin:10px 2px}
#ck-main .ro{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-top:12px}
#ck-main .copybox{min-height:200px;font-size:13px}
#ck-main .loading{color:var(--muted);padding:30px 4px;text-align:center}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}

/* my record + books */
input[type=date],input[type=number],select{font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:48px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .ph{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.prog .ph b{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.bar{height:10px;border-radius:999px;background:var(--none-bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--s4));border-radius:999px}
.bookbar{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--s4);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.task{border-bottom:1px solid var(--line);padding:8px 0}
.task label{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;cursor:pointer}
.task input[type=checkbox],.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--s4)}
.task.on>label>span{color:var(--muted)}
.tmeta{display:flex;gap:8px;align-items:center;margin:6px 0 0 38px;font-size:13px;color:var(--muted)}
.tmeta input{min-height:36px;font-size:14px;padding:4px 8px;max-width:200px}
.ffield{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ffield span{font-size:14px;font-weight:600}
.ffield input{min-height:40px;font-size:15px;padding:6px 10px}
.rowx{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rowx small{display:block;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--none-bg);color:var(--muted)}
.pill.bad{background:var(--bad-bg);color:var(--red)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.xbtn{all:unset;cursor:pointer;min-width:36px;min-height:36px;display:grid;place-items:center;border-radius:8px;color:var(--muted);font-size:20px}
